name: Update Trend Feed

on:
  schedule:
    - cron: "0 2 * * 1,3,5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-trends:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch trends
        run: python scripts/fetch_trends.py --out data/trends.json --keep-existing

      - name: Commit updated trend data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update trend feed"
          file_pattern: data/trends.json
