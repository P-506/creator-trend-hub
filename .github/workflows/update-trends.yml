name: Update Trend Feed

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-trends.yml"
      - "scripts/fetch_trends.py"
      - "index.html"
      - "styles.css"
      - "app.js"
      - "README.md"
  schedule:
    # Every 3 hours from 08:00 to 23:00 Bangkok time.
    - cron: "0 1,4,7,10,13,16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-trends:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch trends
        run: python scripts/fetch_trends.py --out data/trends.json --keep-existing

      - name: Commit updated trend data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update trend feed"
          file_pattern: data/trends.json

      - name: Prepare Pages artifact
        run: |
          mkdir -p dist
          cp index.html styles.css app.js README.md dist/
          cp -R data dist/data
          touch dist/.nojekyll

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          force_orphan: true
          commit_message: "Publish updated trend hub"
